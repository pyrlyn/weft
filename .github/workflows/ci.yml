# The documented merge gate (README.md: "a change merges only after it exits 0"),
# run on every pull request and push to main. mise installs the pinned toolchain
# (moon, the Rust toolchain with wasm32, deno, bun); pnpm owns the dependencies;
# moon runs the tasks with its own caching. The browser leg of root:runtimes
# needs the Playwright Chromium, installed once per run until moon learns to.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac;
  # fork PRs keep the hosted label).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@4b5b5470544893cd515b88c751e92728341c6daa # main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["xcode-27"]'

  gate:
    # macOS, the environment the committed artifacts (the plugins' wasm-web
    # bundles) are built on: a linux runner builds byte-different wasm, and the
    # bundle test compares bytes. Xcode 27 through pyrlyn/ci's setup-xcode —
    # the same pin every pyrlyn repo runs, so the build-tool plugin's verbose
    # output behaves as it does in development (Xcode 26.x hides it).
    # Org variable MACOS_CI_DISABLED=true skips this macOS job.
    if: vars.MACOS_CI_DISABLED != 'true'
    needs: macos-runner
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'xcode-27' }}
    steps:
      # Full history: moon's change detection diffs against the merge base and
      # a shallow checkout makes that fail (git exits 128 on the missing base).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # The workflow lint the pre-push hook (hk.pkl) runs; mise.toml pins jactionlint and shellcheck.
      - uses: pyrlyn/ci/.github/actions/sccache@2321c16a814e33f76e64f9f043b5b9453d25ec65 # ci#123, re-pin to main after merge
        with:
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - run: jactionlint --color
      - uses: pyrlyn/ci/.github/actions/setup-xcode@main
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # The gate in three steps, which together run exactly the documented
      # command. On the runner's few cores the heavy legs starved each other when
      # moon ran them all at once: the runtime legs and the glass screen in the
      # Chromium suite passed their timeouts while the Swift typechecks of the
      # Rust tests and the simulator build ran beside them. Each later step takes
      # the module and the addon from moon's cache of the first.
      - name: The merge gate, Rust and static checks
        run: moon run root:rust-test root:rust-lint root:typecheck root:lint
      - name: The merge gate, package tests
        env:
          # The runner is darwin-arm64 but is not the machine the reviewed
          # baselines were taken on; naming itself skips exactly those
          # comparisons and keeps everything else (live-vs-live, a11y) running.
          WEFT_BASELINE_PLATFORM: github-runner
        run: moon run :test
      - name: The merge gate, runtime legs
        run: moon run root:runtimes
      - if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  winui:
    # The WinUI goldens of crates/weft-winui/tests/fixtures/ through the XAML compiler, which
    # runs on Windows only: every x:Bind path, command and attached property against its view
    # model (T105.7). Not a required check yet: only `pipeline / gate` is, so this job lives
    # here and .github/infra.yml keeps pyrlyn/ci's dotnet check, which the gate would make
    # required, off; turning that check on for this project is how it becomes required.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - run: dotnet build crates/weft-winui/windows/WeftScreens.csproj --configuration Release

  studio-windows:
    # WeftStudio on Windows (T69.1e; T69.1 decision 4): the editor crates' tests, then the Windows
    # leg of studio:test, which builds the WinUI shell with weft_studio_ffi.dll and runs its MSTest
    # suite, including the FlaUI smoke run that opens a corpus screen in the window (GitHub's
    # Windows runners have a desktop session). Not a required check yet, like `winui`.
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # mise-action authenticates only its own step; the mise shims that cargo and pnpm run through
      # install the mise.toml tools it skipped, and unauthenticated that hits GitHub's 60/hour limit.
      GITHUB_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Only the tools this job runs, at the mise.toml pins; the rest are macOS or web tools.
          install_args: node pnpm rust cargo:cargo-nextest
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - run: pnpm install --frozen-lockfile
      # The explicit target is the one the shell's build uses, so the DLL reuses these artifacts.
      - run: cargo nextest run --target x86_64-pc-windows-msvc -p weft-studio -p weft-studio-ffi
      - name: The Windows leg of studio:test
        working-directory: studio
        env:
          WEFT_STUDIO_WINDOWS: required
        run: pnpm exec vitest run --config ../vitest.config.ts
      - name: Window capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weft-studio-windows
          path: target/weft-studio-windows.png
          if-no-files-found: ignore
