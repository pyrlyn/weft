[package]
name = "weft-studio"
description = "The document core of WeftStudio, the desktop editor: open, save and the render input of a Weft screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
weft-catalog = { workspace = true }
weft-core = { workspace = true }
# Default features only: the generator, no Slint crate. The shells' FFI crate adds the runtime.
weft-slint = { workspace = true }

[dev-dependencies]
# The canvas test compiles the generated window. The library itself stays free of the Slint crate.
weft-slint = { workspace = true, features = ["runtime"] }

[lints]
workspace = true
