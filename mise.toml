# Toolchain for weft. `mise install` then `pnpm install`; `moon ci` runs every check.
[tools]
python = "3.15.1" # runs ptools
"pipx:git+https://github.com/pyrlyn/tools.git" = "d6eb6452cbb7ec4b350de87194548915c2648c27" # `mise run sweep`, `just cache`, `just swarfr` (ptools, Python; pyrlyn/tools#8, repin to a tag once merged)
"cargo:cargo-sweep" = "0.8.0" # `mise run sweep`: drops build artifacts unused for 1 day (ptools sweep)
mold = { version = "2.42.1", os = ["linux"] } # linker, Linux only; opt in with `cargo --config .cargo/mold.toml`
node = "26.12.1"
"npm:agent-browser" = "0.39.2" # browser automation CLI for agents: Check rendered Weft UI output and docs in a real browser.
# The registry backend (aqua) ships the native binary; `npm:pnpm` 12 leaves a placeholder script.
pnpm = "12.15.0"
# wasm32: the WebAssembly build of the core for browsers, Deno, Bun and Node.
rust = { version = "1.99.0", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
# No core mise plugin for moon; aqua installs the prebuilt release.
"aqua:moonrepo/moon" = "2.5.6"
deno = "2.9.7"
bun = "1.4.4"
# Runs the Rust tests; no aqua package, so cargo builds or binstalls it.
"cargo:cargo-nextest" = "0.9.143"
"aqua:rustwasm/wasm-pack" = "0.15.0"
# Must equal the wasm-bindgen crate version, or the generated glue does not load.
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
"npm:@napi-rs/cli" = "3.10.6"
# Generates the Xcode projects of plugins/xcode (the samples and the editor extension) from YAML.
# macOS only: the aqua package ships a Darwin zip (`supported_envs: darwin`), so `mise install` on
# Linux would fail without this filter (the Pages deploy builds on ubuntu-latest).
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] }
# The pipx backend installs Python tools through uv; pinned here so `mise install` works without a global uv.
uv = "0.13.5"
# Translate Toolkit: localization file converters and checks (po2json, pofilter, pocount). Not in the mise registry.
"pipx:translate-toolkit" = "3.20.0"
# Lints the workflows: the pre-push hook (hk.pkl) and `mise x -- jactionlint`. The local mise registry lacks the short name.
"github:jdx/jactionlint" = "2.0.2"
# Runs jactionlint as a pre-push hook (hk.pkl); install it once per clone with `mise x -- hk install --mise`.
hk = "2.5.0"
# jactionlint checks `run:` scripts with it; without a pin the global mise shim has no version and the lint errors out.
shellcheck = "0.11.0"


[tasks.sweep]
description = "Remove cargo build artifacts unused for 1 day (cargo-sweep, via ptools)"
run = "ptools sweep --days 1"

[tasks.sweep-dry]
description = "Preview what sweep would remove; deletes nothing"
run = "ptools sweep --days 1 --dry-run"
