# The Weft plugin for the coding agent (plan.md T106.3). Build the module with `moon run agent-plugin:build`,
# then `the coding agent plugin install plugins/cox`. The schema is the coding agent's docs/plugin.schema.json; the test
# tests/manifest.rs reads this file into the coding agent's own manifest type.
api = 1
id = "weft"
version = "0.1.0"
name = "Weft"
description = "Write, check and fix Weft UI markup: the Weft agent tools of the MCP server"
wasm = "weft.wasm"

# The core catalog, a project's catalogs and a large markup fit well under the host maximum;
# a call validates or formats in milliseconds, so the budget only bounds a runaway input.
[limits]
memory_mib = 64
call_ms = 10000

# Tools, the skill below and, in the desktop app, the canvas pane: no files, network, store,
# model or other UI. The project comes from the [plugins.weft] table of the coding agent's config, inline.
[capabilities]
tools = [
  "weft_primer",
  "weft_capabilities",
  "weft_catalog",
  "weft_schema",
  "weft_validate",
  "weft_format",
  "weft_patch",
  "weft_render",
  "weft_context",
]

# The Design tab (plan.md T106.8): the screens the tools saw, drawn as static pages in the coding agent's
# isolated canvas pane. Its own grant line, `desktop.canvas`.
[capabilities.desktop]
canvas = true

# The authoring guide as an Agent Skill (the coding agent T33.46): SKILL.md and its AGENT-SPEC.md copy, which
# plugins/shared/build.ts writes beside the other plugins' copies.
[[skills]]
name = "weft-spec"
dir = "skills/weft-spec"
