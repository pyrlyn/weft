# The Weft plugin for the coding agent. A workspace of its own, outside the root `members = ["crates/*"]`, so
# the root `cargo nextest run --workspace` and clippy never fetch pyrlyn/cox or build guest code.
[workspace]
resolver = "3"

[package]
name = "weft-cox"
description = "The Weft agent tools as a cox plugin: a WebAssembly module on cox-plugin-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# The cdylib is the plugin module; the rlib lets the tests run the pure parts on the host.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Not on crates.io: pinned to a pyrlyn/cox commit, so the ABI the module is built against only
# changes when this line does. Only this package of the repository is built.
cox-plugin-sdk = { git = "https://github.com/pyrlyn/cox", rev = "ea6227cf958a7106ae12f44c2f02286c39b9c5ba" }
serde = "1.0"
serde_json = "1.0"
# The core only (no `web` feature): the tools need no importers.
weft-binding = { path = "../../crates/weft-binding" }
# The canvas: a screen's id and an element's path in the markup as written.
weft-core = { path = "../../crates/weft-core" }
# The default tokens, for a page drawn without project tokens.
weft-catalog = { path = "../../crates/weft-catalog" }
# `weft_render`'s page with `html`: the static generator, where the MCP server has the React
# reference renderer, which needs JavaScript.
weft-web = { path = "../../crates/weft-web" }

[dev-dependencies]
# Parses plugin.toml into the coding agent's own manifest type in tests/manifest.rs.
toml = "1"
# The shared extism engine of the coding agent's plugin host (packages/crates); tests/e2e.rs loads the module
# with it. Not on crates.io yet, so pinned to a pyrlyn/crates commit.
wasm-plugin-host = { git = "https://github.com/pyrlyn/crates", rev = "7fc02456ec732e6b742ffb8245ad78d5318e7b9d" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
# The module is downloaded into every coding agent session that loads it.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
